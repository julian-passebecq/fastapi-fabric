[project]
name = "fastapi-fabric"
version = "0.1.0"
description = "Standalone FastAPI backend for Fabric Factory Lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.128,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
